# EMS 前端（3020）＋ 同源反代 ems_backend（5320）。install.sh 裝到 /etc/nginx/sites-available/ems
# ⚠ 同一個 distro 可能還有其他 site，這個檔只管 3020，不要動其他 site
server {
    listen 3020;
    root /home/demo/apps/ems/web;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    # 入口檔不快取：部署新版後重新整理就拿到新的分頁檔名
    location = /index.html { add_header Cache-Control "no-cache"; }

    # 打包後的檔案（檔名含 hash）：找不到就回 404，不能退回 index.html。
    # 2026-10-05 實際遇到：部署前開著的分頁要舊檔名的分頁檔，拿到 index.html（200）當成 JS 載入失敗，登入成功後停在登入頁、沒有任何提示
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5320;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
