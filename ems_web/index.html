<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMS</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      // 首屏就套上主題，避免閃一下（跟 src/theme/useTheme.ts 同一個 key）；預設淺色
      document.documentElement.dataset.theme = localStorage.getItem('ems-theme') === 'dark' ? 'dark' : 'light'
    </script>
    <style>
      html[data-theme='dark'], html[data-theme='dark'] body { background: #07090c; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f3f5f7; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
